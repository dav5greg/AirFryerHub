name: Link PWA manifest once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  link-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link manifest and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          link = '<link rel="manifest" href="./manifest.json">'

          if 'rel="manifest"' not in text:
              marker = '<link rel="apple-touch-icon" sizes="180x180" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f35f.png">'
              if marker not in text:
                  raise SystemExit("Manifest link insertion point not found")
              text = text.replace(marker, marker + "\n    " + link, 1)
              index.write_text(text, encoding="utf-8")

          verify = index.read_text(encoding="utf-8")
          if link not in verify:
              raise SystemExit("Manifest link verification failed")

          workflow = Path(".github/workflows/link-manifest-once.yml")
          workflow.unlink()

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/link-manifest-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "PWA: collega manifest all'app"
          git push
