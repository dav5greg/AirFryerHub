name: Validate recipe database

on:
  push:
    paths:
      - "data/recipes.json"
      - ".github/workflows/validate-recipes.yml"
  pull_request:
    paths:
      - "data/recipes.json"
      - ".github/workflows/validate-recipes.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/recipes.json','utf8')); if(!Array.isArray(d)) throw new Error('recipes.json must be an array'); for(const r of d){if(!r||typeof r.id!=='string'||typeof r.name!=='string'||typeof r.category!=='string'||!['snack','carne','pesce','dolci','altro'].includes(r.category)||!Number.isFinite(Number(r.temp))||!Number.isFinite(Number(r.time))||typeof r.shake!=='boolean') throw new Error('Invalid recipe: '+JSON.stringify(r));} console.log('recipes.json OK:',d.length,'recipes');"
